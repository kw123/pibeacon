<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" width="780" height="580">
  <rect x="0" y="0" width="780" height="580" fill="#ffffff"/>
  <g stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round">

    <!-- ============ the three rpi header pins this hangs off ============ -->
    <line x1="44" y1="44" x2="44" y2="516" stroke-width="1.4" stroke-dasharray="5 5"/>
    <rect x="54" y="52"  width="16" height="16" fill="#1a1a1a"/>
    <rect x="54" y="377" width="16" height="16" fill="#1a1a1a"/>
    <rect x="54" y="492" width="16" height="16" fill="#1a1a1a"/>

    <!-- +5 V rail, straight off the header -->
    <line x1="70" y1="60" x2="600" y2="60"/>

    <!-- ============ branch A : three IR LEDs and the 2 ohm ballast ============ -->
    <line x1="300" y1="60" x2="300" y2="88"/>
    <polygon points="286,88 314,88 300,112" fill="#1a1a1a"/>
    <line x1="286" y1="112" x2="314" y2="112"/>
    <line x1="300" y1="112" x2="300" y2="140"/>
    <polygon points="286,140 314,140 300,164" fill="#1a1a1a"/>
    <line x1="286" y1="164" x2="314" y2="164"/>
    <line x1="300" y1="164" x2="300" y2="192"/>
    <polygon points="286,192 314,192 300,216" fill="#1a1a1a"/>
    <line x1="286" y1="216" x2="314" y2="216"/>
    <line x1="300" y1="216" x2="300" y2="248"/>
    <g stroke-width="1.6">
      <line x1="320" y1="96" x2="342" y2="86"/><polygon points="342,86 334,84 337,91" fill="#1a1a1a" stroke="none"/>
      <line x1="320" y1="106" x2="342" y2="96"/><polygon points="342,96 334,94 337,101" fill="#1a1a1a" stroke="none"/>
    </g>
    <rect x="288" y="248" width="24" height="46" fill="#ffffff"/>
    <line x1="300" y1="294" x2="300" y2="340"/>

    <!-- ============ branch B : green indicator, in parallel ============ -->
    <line x1="540" y1="60" x2="540" y2="100"/>
    <polygon points="526,100 554,100 540,124" fill="#ffffff"/>
    <line x1="526" y1="124" x2="554" y2="124"/>
    <line x1="540" y1="124" x2="540" y2="176"/>
    <g stroke-width="1.6">
      <line x1="560" y1="106" x2="582" y2="96"/><polygon points="582,96 574,94 577,101" fill="#1a1a1a" stroke="none"/>
    </g>
    <rect x="528" y="176" width="24" height="46" fill="#ffffff"/>
    <line x1="540" y1="222" x2="540" y2="340"/>

    <!-- both branches meet on the collector line -->
    <line x1="300" y1="340" x2="540" y2="340"/>
    <circle cx="300" cy="340" r="4" fill="#1a1a1a"/>
    <circle cx="540" cy="340" r="4" fill="#1a1a1a"/>
    <circle cx="422" cy="340" r="4" fill="#1a1a1a"/>

    <!-- ============ NPN : base bar at x=380, leads touching it ============ -->
    <line x1="380" y1="356" x2="380" y2="414"/>
    <line x1="380" y1="370" x2="422" y2="340"/>
    <line x1="380" y1="400" x2="422" y2="432"/>
    <polygon points="410.2,423.0 395.0,418.3 401.6,409.6" fill="#1a1a1a" stroke="none"/>
    <line x1="422" y1="432" x2="422" y2="500"/>

    <!-- base lead, straight into the 560 ohm, and on to the gpio pin -->
    <line x1="380" y1="385" x2="246" y2="385"/>
    <rect x="200" y="373" width="46" height="24" fill="#ffffff"/>
    <line x1="200" y1="385" x2="70" y2="385"/>
    <circle cx="140" cy="385" r="4" fill="#1a1a1a"/>

    <!-- 15k from that same node down to the ground rail -->
    <line x1="140" y1="385" x2="140" y2="416"/>
    <rect x="128" y="416" width="24" height="46" fill="#ffffff"/>
    <line x1="140" y1="462" x2="140" y2="500"/>

    <!-- ground rail, straight back to the header -->
    <line x1="70" y1="500" x2="422" y2="500"/>
    <circle cx="422" cy="500" r="4" fill="#1a1a1a"/>
    <circle cx="140" cy="500" r="4" fill="#1a1a1a"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
    <text x="34" y="300" font-size="14" fill="#555555" transform="rotate(-90 34 300)" text-anchor="middle">rPi header</text>
    <text x="80" y="48" font-size="16" font-weight="600">+5 V</text>
    <text x="80" y="371" font-size="16" font-weight="600">GPIO 18</text>
    <text x="80" y="524" font-size="16" font-weight="600">GND</text>

    <text x="326" y="132" font-size="15">3 x IR940</text>
    <text x="326" y="150" font-size="13" fill="#555555">~1.35 V each at 120 mA</text>
    <text x="322" y="278" font-size="15">2 Ω</text>
    <text x="566" y="118" font-size="15">green</text>
    <text x="566" y="136" font-size="13" fill="#555555">it is sending</text>
    <text x="562" y="206" font-size="15">4.7 kΩ</text>
    <text x="203" y="366" font-size="15">560 Ω</text>
    <text x="160" y="447" font-size="15">15 kΩ</text>
    <text x="160" y="465" font-size="13" fill="#555555">pull-down</text>
    <text x="440" y="380" font-size="15">NPN</text>
    <text x="440" y="398" font-size="13" fill="#555555">~4.6 mA base</text>
    <text x="440" y="416" font-size="13" fill="#555555">~120 mA collector</text>
  </g>
</svg>
